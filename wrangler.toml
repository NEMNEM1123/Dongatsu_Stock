name = "dongatsu-stock"
main = "worker/index.ts"
compatibility_date = "2026-01-01"

[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws"]

[[durable_objects.bindings]]
name = "MARKET"
class_name = "Market"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Market"]
